<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ear Tag OCR Test Tool</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #12160f; color: #e7ebe0; font-family: system-ui, -apple-system, sans-serif;
    max-width: 640px; margin: 0 auto; padding: 24px 16px 60px;
  }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  .subtitle { color: #9aa38e; font-size: 0.9rem; margin-bottom: 24px; }
  .dropzone {
    border: 2px dashed #3a4232; border-radius: 12px; padding: 40px 20px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .dropzone.drag-over { border-color: #8CC63F; background: rgba(140,198,63,.08); }
  .dropzone p { color: #9aa38e; margin: 8px 0 0; font-size: 0.9rem; }
  input[type=file] { display: none; }
  #preview { max-width: 100%; max-height: 320px; margin-top: 20px; border-radius: 8px; display: none; }
  #status { margin-top: 16px; color: #9aa38e; font-size: 0.9rem; }
  #result {
    margin-top: 20px; background: rgba(255,255,255,.04); border: 1px solid #2a3222;
    border-radius: 10px; padding: 16px 18px; display: none;
  }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid #212819; }
  .row:last-child { border-bottom: none; }
  .row .label { color: #9aa38e; }
  .row .value { font-family: ui-monospace, monospace; text-align: right; }
  .big-number { font-size: 1.6rem; font-weight: 600; letter-spacing: 0.02em; margin: 4px 0 14px; }
  .needs-review { color: #e0a552; }
  .ok { color: #8CC63F; }
  .error-text { color: #e05252; }
</style>
</head>
<body>
  <h1>🏷️ Ear Tag OCR Test Tool</h1>
  <p class="subtitle">Testing only — not connected to the claim flow. Pick any photo, see the raw OCR result.</p>

  <div class="dropzone" id="dropzone">
    <div>📷 Click to choose a photo, or drag one here</div>
    <p>JPEG/PNG, any ear tag photo</p>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <img id="preview" alt="preview">
  <div id="status"></div>
  <div id="result"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) handleFile(fileInput.files[0]);
});

async function handleFile(file) {
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  resultEl.style.display = 'none';
  statusEl.textContent = 'Running OCR… (a few seconds on CPU)';

  const formData = new FormData();
  formData.append('file', file);

  try {
    const resp = await fetch('/api/ocr_test/upload', { method: 'POST', body: formData });
    const data = await resp.json();
    statusEl.textContent = '';
    renderResult(data);
  } catch (err) {
    statusEl.textContent = '';
    resultEl.style.display = 'block';
    resultEl.innerHTML = `<div class="error-text">Request failed: ${err.message}</div>`;
  }
}

function renderResult(data) {
  resultEl.style.display = 'block';
  const reviewClass = data.needs_review ? 'needs-review' : 'ok';
  const reviewText = data.needs_review ? '⚠️ NEEDS REVIEW' : '✓ Looks good';

  let html = `<div class="big-number">${data.combined_text || '(nothing read)'}</div>`;
  html += `<div class="row"><span class="label">Status</span><span class="value ${reviewClass}">${reviewText}</span></div>`;
  html += `<div class="row"><span class="label">Confidence</span><span class="value">${Math.round((data.confidence||0)*100)}%</span></div>`;
  html += `<div class="row"><span class="label">Lines detected</span><span class="value">${(data.lines||[]).join(', ') || '—'}</span></div>`;
  html += `<div class="row"><span class="label">Letter fragments</span><span class="value ${data.letters_need_review ? 'needs-review' : ''}">${(data.letter_lines||[]).join(', ') || '—'}${data.letters_need_review ? ' (uncertain)' : ''}</span></div>`;
  if (data.debug_raw_lines && data.debug_raw_lines.length) {
    const rawStr = data.debug_raw_lines.map(([t,s]) => `${t} (${Math.round(s*100)}%)`).join(', ');
    html += `<div class="row"><span class="label">All raw detections</span><span class="value">${rawStr}</span></div>`;
  }
  if (data.error) {
    html += `<div class="row"><span class="label">Error</span><span class="value error-text">${data.error}</span></div>`;
  }
  resultEl.innerHTML = html;
}
</script>
</body>
</html>
